name: quartier
description: "Quartier rental app for landlords and tenants (Flutter port)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^4.0.4
  cloud_firestore: ^6.10.0
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apartment1.jpg
